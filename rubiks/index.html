<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rubiks — cube timer</title>
<meta name="description" content="Speedcubing timer: WCA inspection, random-state 2x2 and scrambles for ten events, scramble preview, averages, trends and history. Works offline, nothing leaves the device." />
<meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="manifest" href="manifest.webmanifest?v=2" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/apple-touch.png" />

<link rel="stylesheet" href="css/rubiks.css?v=2" />
<!-- One version number: sw.js carries it as its cache name, and tools/validate.js refuses to let the two drift. -->
<script>window.RK_VERSION = "2";</script>
<!-- The theme is applied before the stylesheet paints, so a light-mode choice never flashes dark. -->
<script>try { var t = JSON.parse(localStorage.getItem("rk.settings") || "{}").theme; if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
</head>
<body data-state="idle">

<div id="update-bar" hidden>
  <span>A new version is ready.</span>
  <button id="update-go">Reload</button>
  <button id="update-later">Later</button>
</div>

<div class="app">

  <!-- The session: a column on wide screens, a sheet on phones. Same markup. -->
  <aside id="side" class="side" aria-label="Session">
    <div class="side-head">
      <button id="side-close" class="side-grip" aria-label="Close session"><span></span></button>
      <div class="side-title">
        <h2>Session</h2>
        <span id="side-event" class="side-event">3x3</span>
      </div>
      <button id="btn-stats" class="icon-btn" title="Statistics" aria-label="Statistics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>
      </button>
      <button id="btn-clear" class="icon-btn" title="Clear this event's solves" aria-label="Clear this event's solves">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
      </button>
    </div>

    <table class="stat-table">
      <thead><tr><th></th><th>Current</th><th>Best</th></tr></thead>
      <tbody id="stat-body"></tbody>
    </table>
    <div class="side-facts" id="side-facts"></div>

    <div id="mini-chart" class="chart mini-chart"></div>

    <div class="list-head">
      <span>#</span><span>Time</span><span>Ao5</span><span>Ao12</span>
    </div>
    <div id="solve-list" class="solve-list"></div>
  </aside>

  <main class="stage">
    <header class="topbar">
      <a class="brand" href="../" aria-label="nojukuramu home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="6.2" height="6.2" rx="1.6" fill="#e0312b"/><rect x="8.9" y="2" width="6.2" height="6.2" rx="1.6" fill="#f4f4f2"/><rect x="15.8" y="2" width="6.2" height="6.2" rx="1.6" fill="#1fa34a"/><rect x="2" y="8.9" width="6.2" height="6.2" rx="1.6" fill="#2563eb"/><rect x="8.9" y="8.9" width="6.2" height="6.2" rx="1.6" fill="#f7811d"/><rect x="15.8" y="8.9" width="6.2" height="6.2" rx="1.6" fill="#f7d21c"/><rect x="2" y="15.8" width="6.2" height="6.2" rx="1.6" fill="#f4f4f2"/><rect x="8.9" y="15.8" width="6.2" height="6.2" rx="1.6" fill="#1fa34a"/><rect x="15.8" y="15.8" width="6.2" height="6.2" rx="1.6" fill="#e0312b"/></svg>
        <span>rubiks</span>
      </a>
      <button id="btn-event" class="event-btn" aria-haspopup="dialog">
        <span id="event-name">3x3</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="spacer"></div>
      <button id="btn-stats-top" class="icon-btn" title="Statistics" aria-label="Statistics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
      <button class="icon-btn" data-info="timer" aria-label="How the timer works">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </button>
    </header>

    <section class="scramble-card" aria-label="Scramble">
      <div id="scramble" class="scramble-text"></div>
      <div class="scramble-tools">
        <button id="btn-new-scramble" class="icon-btn" title="New scramble" aria-label="New scramble">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
        </button>
        <button id="btn-copy-scramble" class="icon-btn" title="Copy scramble" aria-label="Copy scramble">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
        </button>
        <button class="icon-btn" data-info="scramble" aria-label="About scrambles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </button>
      </div>
    </section>

    <section id="timer-area" class="timer-area" aria-label="Timer. Hold space, or touch and hold here.">
      <div class="glow" aria-hidden="true"></div>
      <div id="time" class="timer-display" aria-live="off"><span class="t-main">0</span><span class="t-frac">.00</span></div>
      <form id="typing" class="typing" hidden autocomplete="off">
        <input id="typing-input" inputmode="decimal" enterkeyhint="done" placeholder="Type a time" aria-label="Type a time, then Enter" />
      </form>
      <div id="timer-sub" class="timer-sub"></div>
      <div id="pb" class="pb" hidden></div>
      <div id="last-actions" class="last-actions" hidden>
        <button data-last="ok">OK</button>
        <button data-last="+2">+2</button>
        <button data-last="DNF">DNF</button>
        <button data-last="note" aria-label="Add a note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button data-last="delete" aria-label="Delete this solve">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
      </div>
    </section>

    <footer class="stage-foot">
      <button id="session-peek" class="session-peek" aria-label="Open session">
        <span class="peek-item"><small>Ao5</small><strong id="peek-ao5">-</strong></span>
        <span class="peek-item"><small>Ao12</small><strong id="peek-ao12">-</strong></span>
        <span class="peek-item"><small>Solves</small><strong id="peek-count">0</strong></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <button id="preview" class="preview" title="Scramble preview" aria-label="Enlarge scramble preview"></button>
    </footer>
  </main>
</div>

<div id="scrim" class="scrim" hidden></div>

<section id="sheet-event" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-event-title" hidden>
  <div class="sheet-head"><h3 id="sheet-event-title">Event</h3><button class="icon-btn" data-info="puzzle" aria-label="About events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div id="event-grid" class="event-grid"></div>
</section>

<section id="sheet-stats" class="sheet sheet-wide" role="dialog" aria-modal="true" aria-labelledby="sheet-stats-title" hidden>
  <div class="sheet-head"><h3 id="sheet-stats-title">Statistics</h3><button class="icon-btn" data-info="averages" aria-label="About averages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div id="stats-body" class="stats-body"></div>
</section>

<section id="sheet-solve" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-solve-title" hidden>
  <div class="sheet-head"><h3 id="sheet-solve-title">Solve</h3><button class="icon-btn" data-info="penalties" aria-label="About penalties"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div id="solve-body" class="solve-body"></div>
</section>

<section id="sheet-preview" class="sheet" role="dialog" aria-modal="true" aria-label="Scramble preview" hidden>
  <div class="sheet-head"><h3>Scramble preview</h3><button class="icon-btn" data-info="preview" aria-label="About the preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div id="preview-big" class="preview-big"></div>
</section>

<section id="sheet-settings" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-settings-title" hidden>
  <div class="sheet-head"><h3 id="sheet-settings-title">Settings</h3><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="settings">
    <h4>Timing</h4>
    <div class="set-row">
      <span class="set-label">WCA inspection <button class="info-dot" data-info="inspection" aria-label="About inspection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></span>
      <label class="switch"><input type="checkbox" data-set="inspection" /><span></span></label>
    </div>
    <div class="set-row">
      <span class="set-label">8s / 12s calls</span>
      <div class="seg" data-set="alerts"><button value="voice">Voice</button><button value="beep">Beep</button><button value="off">Off</button></div>
    </div>
    <div class="set-row">
      <span class="set-label">Hold to arm <button class="info-dot" data-info="hold" aria-label="About hold time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></span>
      <div class="seg" data-set="holdMs"><button value="0">None</button><button value="300">0.3s</button><button value="550">0.55s</button></div>
    </div>
    <div class="set-row">
      <span class="set-label">Entry <button class="info-dot" data-info="typing" aria-label="About typing times"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></span>
      <div class="seg" data-set="input"><button value="timer">Timer</button><button value="typing">Typing</button></div>
    </div>
    <div class="set-row">
      <span class="set-label">Hide time while solving</span>
      <label class="switch"><input type="checkbox" data-set="hideRunning" /><span></span></label>
    </div>

    <h4>Display</h4>
    <div class="set-row">
      <span class="set-label">Decimals</span>
      <div class="seg" data-set="decimals"><button value="2">0.01</button><button value="3">0.001</button></div>
    </div>
    <div class="set-row">
      <span class="set-label">Scramble preview</span>
      <label class="switch"><input type="checkbox" data-set="preview" /><span></span></label>
    </div>
    <div class="set-row">
      <span class="set-label">Target time <button class="info-dot" data-info="target" aria-label="About the target"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></span>
      <input id="set-target" class="set-input" inputmode="decimal" placeholder="e.g. 20" aria-label="Target time in seconds" />
    </div>
    <div class="set-row">
      <span class="set-label">Keep screen on</span>
      <label class="switch"><input type="checkbox" data-set="wake" /><span></span></label>
    </div>
    <div class="set-row">
      <span class="set-label">Theme</span>
      <div class="seg" data-set="theme"><button value="auto">Auto</button><button value="dark">Dark</button><button value="light">Light</button></div>
    </div>

    <h4>Your data <button class="info-dot" data-info="export" aria-label="About your data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></h4>
    <div class="set-actions">
      <button id="btn-backup" class="btn">Back up all</button>
      <label class="btn">Restore<input id="restore-file" type="file" accept="application/json,.json" hidden /></label>
      <button id="btn-export" class="btn">CSV for this event</button>
    </div>

    <div class="version-line">
      <span id="version-num">v2</span>
      <button id="btn-check-update">Check for updates</button>
      <button class="link-btn" data-info="keys">Keyboard shortcuts</button>
    </div>
  </div>
</section>

<div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-undo">Undo</button></div>

<noscript>
  <div style="max-width:420px;margin:40px auto;padding:20px;text-align:center">
    <h2>This timer needs JavaScript</h2>
    <p>Everything runs in your browser, nothing is sent anywhere.</p>
  </div>
</noscript>

<script src="js/icons.js?v=2"></script>
<script src="js/cube.js?v=2"></script>
<script src="js/solver222.js?v=2"></script>
<script src="js/scramble.js?v=2"></script>
<script src="js/store.js?v=2"></script>
<script src="js/stats.js?v=2"></script>
<script src="js/timer.js?v=2"></script>
<script src="js/sound.js?v=2"></script>
<script src="js/wake.js?v=2"></script>
<script src="js/chart.js?v=2"></script>
<script src="js/info.js?v=2"></script>
<script src="js/update.js?v=2"></script>
<script src="js/sheets.js?v=2"></script>
<script src="js/panels.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
