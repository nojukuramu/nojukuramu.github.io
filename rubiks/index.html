<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rubiks — cube timer</title>
<meta name="description" content="Spacebar timer for Rubik's cube solves. Scramble generation, session stats, averages, and history. Works offline, nothing leaves the device." />
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="manifest" href="manifest.webmanifest?v=1" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/apple-touch.png" />

<link rel="stylesheet" href="css/rubiks.css?v=1" />
<!-- One version number: sw.js carries it as its cache name, and tools/validate.js refuses to let the two drift. -->
<script>window.RK_VERSION = "1";</script>
</head>
<body>

<div id="update-bar" hidden>
  <span>A new version is ready.</span>
  <button id="update-go">Reload</button>
  <button id="update-later">Later</button>
</div>

<header class="topbar">
  <a class="brand" href="../" aria-label="nojukuramu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    <span>rubiks</span>
  </a>
  <div class="spacer"></div>
  <div class="puzzle-sel" role="tablist" aria-label="Puzzle type">
    <button data-puzzle="2x2" role="tab">2x2</button>
    <button data-puzzle="3x3" role="tab">3x3</button>
    <button data-puzzle="4x4" role="tab">4x4</button>
  </div>
  <button class="btn-info" data-info="puzzle" aria-label="About puzzle types"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
</header>

<div class="scramble-bar">
  <span id="scramble" class="scramble-text"></span>
  <button id="btn-new-scramble" class="tb-btn" title="New scramble" aria-label="New scramble">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 105.64-12.86L1 10"/></svg>
  </button>
  <button class="btn-info" data-info="scramble" aria-label="About scrambles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
</div>

<div id="timer-area" class="timer-area" data-state="idle">
  <div id="timer-touch" class="timer-touch" aria-label="Touch to start timer"></div>
  <div id="time" class="timer-display">0.00</div>
  <div class="timer-hint">Hold Space or tap to start</div>
</div>

<div id="stats-grid" class="stats-strip">
  <div class="stat-card">
    <div class="stat-label">Ao5</div>
    <div class="stat-value" id="stat-ao5">-</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Ao12</div>
    <div class="stat-value" id="stat-ao12">-</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Mean</div>
    <div class="stat-value" id="stat-mean">-</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Best</div>
    <div class="stat-value" id="stat-best">-</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Best Ao5</div>
    <div class="stat-value" id="stat-best-ao5">-</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Best Ao12</div>
    <div class="stat-value" id="stat-best-ao12">-</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Solves</div>
    <div class="stat-value" id="stat-count">0</div>
  </div>
</div>

<div class="list-header">
  <span class="list-title">History</span>
  <button class="btn-info" data-info="penalties" aria-label="About penalties"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
  <button class="btn-info" data-info="averages" aria-label="About averages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
  <div class="spacer"></div>
  <button id="btn-export" class="tb-btn" title="Export CSV" aria-label="Export solves as CSV">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </button>
  <button id="btn-clear" class="tb-btn" title="Clear all solves" aria-label="Clear all solves">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
  </button>
</div>
<div id="solve-list" class="solve-list">
  <div class="empty">No solves yet</div>
</div>

<footer class="footer">
  <span id="version-num">v1</span>
  <button id="btn-check-update">Check for updates</button>
  <div class="spacer"></div>
  <button class="btn-info" data-info="timer" aria-label="How the timer works"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
</footer>

<noscript>
  <div style="max-width:420px;margin:40px auto;padding:20px;text-align:center">
    <h2>This timer needs JavaScript</h2>
    <p>Everything runs in your browser, nothing is sent anywhere.</p>
  </div>
</noscript>

<script src="js/icons.js?v=1"></script>
<script src="js/scramble.js?v=1"></script>
<script src="js/store.js?v=1"></script>
<script src="js/stats.js?v=1"></script>
<script src="js/timer.js?v=1"></script>
<script src="js/info.js?v=1"></script>
<script src="js/update.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
