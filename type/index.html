<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type — a typing trainer that never repeats</title>
<meta name="description" content="Type sentences, terminal sessions, source code and random keyboard characters. Every challenge is built on the spot, and there is nothing to click: you just type.">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Type">
<link rel="stylesheet" href="css/type.css">
<!-- One version number: sw.js carries it as its cache name, and tools/validate.js refuses to let the two drift. Bumping it is what publishes an update. -->
<script>window.TY_VERSION = "1";</script>
</head>
<body>

<header id="top">
  <a class="brand" href="../" aria-label="nojukuramu — home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    <span>type</span>
  </a>

  <nav id="cats" role="tablist" aria-label="Category">
    <button role="tab" data-cat="all" title="Alt+1">Mixed</button>
    <button role="tab" data-cat="text" title="Alt+2">Text</button>
    <button role="tab" data-cat="terminal" title="Alt+3">Terminal</button>
    <button role="tab" data-cat="code" title="Alt+4">Code</button>
    <button role="tab" data-cat="keys" title="Alt+5">Keys</button>
    <button class="info" data-info="categories" aria-label="About the categories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
  </nav>

  <div id="lens" role="group" aria-label="Length">
    <button data-len="short">Short</button>
    <button data-len="medium">Medium</button>
    <button data-len="long">Long</button>
  </div>
</header>

<main id="stage" data-kind="text" data-state="idle">
  <div id="hud" aria-live="off">
    <div class="stat"><b id="liveWpm">0</b><span>wpm</span></div>
    <div class="stat"><b id="liveAcc">100</b><span>% acc</span></div>
    <div class="stat"><b id="liveTime">0.0</b><span>s</span></div>
    <div class="meter" aria-hidden="true"><i id="prog"></i></div>
    <div class="stat best"><b id="bestWpm">--</b><span>best</span></div>
  </div>

  <div id="board">
    <!-- the five faces of the same box; main.js fills the one the challenge needs -->
    <section id="v-text" class="view" hidden><div class="doc" id="docText"></div></section>

    <section id="v-terminal" class="view" hidden>
      <div class="win term">
        <div class="bar"><i></i><i></i><i></i><span id="termTitle">bash</span></div>
        <div class="body" id="termBody"></div>
      </div>
    </section>

    <section id="v-code" class="view" hidden>
      <div class="win editor">
        <div class="bar tabs"><span class="tab" id="codeFile">main.js</span></div>
        <div class="body" id="codeBody"></div>
        <div class="status"><span id="codeLang">JavaScript</span><span id="codePos">Ln 1, Col 1</span></div>
      </div>
    </section>

    <section id="v-keys" class="view" hidden>
      <div class="keycap" id="nextKey" aria-hidden="true"></div>
      <div class="doc keysdoc" id="keysText"></div>
    </section>

    <section id="v-convo" class="view" hidden>
      <div class="win chat">
        <div class="bar"><span id="chatTitle">chat</span></div>
        <div class="body" id="chatBody"></div>
        <div class="composer"><div class="doc" id="chatInput"></div></div>
      </div>
    </section>
  </div>

  <div id="result" hidden>
    <div class="big"><b id="rWpm">0</b><span>wpm</span></div>
    <dl>
      <div><dt>accuracy</dt><dd id="rAcc">100%</dd></div>
      <div><dt>time</dt><dd id="rTime">0s</dd></div>
      <div><dt>characters</dt><dd id="rChars">0</dd></div>
      <div><dt>steadiness <button class="info" data-info="scoring" aria-label="How this is scored"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></dt><dd id="rSteady">100</dd></div>
    </dl>
    <svg id="spark" viewBox="0 0 160 36" preserveAspectRatio="none" aria-hidden="true"><polyline points=""/></svg>
    <p id="rNote"></p>
    <div class="actions">
      <button id="btnNext" class="primary">Next <kbd>Enter</kbd></button>
      <button id="btnRetry">Again <kbd>Tab</kbd></button>
    </div>
  </div>

  <p id="focusHint" hidden>Click here, or press any key, to carry on typing</p>
</main>

<!-- The one place keystrokes go. It is kept focused for you, so nobody has to click it. -->
<textarea id="cap" aria-label="Type here" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" rows="1"></textarea>

<footer>
  <span class="keyhints"><kbd>Esc</kbd> new <kbd>Tab</kbd> again <kbd>Enter</kbd> next</span>
  <span class="meta"><button class="info" data-info="about" aria-label="About this page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    <span id="seedLine"></span> · <span id="verLine"></span> · <button id="btnCheckUpdate" class="linkbtn">Check for updates</button></span>
</footer>

<div id="info-scrim" hidden></div>
<div id="info-sheet" role="dialog" aria-modal="true" aria-labelledby="info-title" hidden>
  <div class="sheet-head"><h2 id="info-title"></h2><button id="info-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="info-body"></div>
</div>

<div id="update-bar" hidden>
  <span>A new version of Type is ready.</span>
  <button id="update-go" class="primary small">Reload</button>
  <button id="update-later" aria-label="Later"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<noscript><p class="noscript">Type needs JavaScript, since the keys are the whole point.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
