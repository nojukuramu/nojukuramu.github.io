<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Notes — offline</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100dvh;
      display: grid; place-items: center; padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f5f9; color: #1b1b23;
    }
    @media (prefers-color-scheme: dark) { body { background: #101018; color: #edecf3; } }
    .box { max-width: 380px; text-align: center; }
    .mark {
      width: 66px; height: 66px; margin: 0 auto 18px;
      border-radius: 50%; border: 3px solid #7c5cff;
      display: grid; place-items: center; font-size: 28px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 18px; opacity: .7; line-height: 1.6; font-size: 14px; }
    a {
      display: inline-block; padding: 10px 20px; border-radius: 999px;
      background: #7c5cff; color: #fff; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">⏰</div>
    <h1>Task Notes is offline</h1>
    <p>The app itself works without a connection — this page only appears when the cached copy could not be found. Reloading usually fixes it.</p>
    <a href="./">Reload Task Notes</a>
  </div>
</body>
</html>
