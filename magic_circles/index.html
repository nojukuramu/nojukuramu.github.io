<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Magic Circles — A Certain RPG</title>
<meta name="description" content="Draw your own spells and walk a world that never ends. A 2.5D spell-drawing RPG in the browser: seeded lands, roads and ruins, Wardens to beat, offline once installed.">
<meta name="theme-color" content="#0d131c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icons/mc-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/mc-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magic Circles">
<link rel="stylesheet" href="css/game.css">
<!-- One version number: sw.js carries it as its cache name, and tools/validate.js refuses to let the two drift. Bumping it is what publishes an update. -->
<script>window.MC_VERSION = "3";</script>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.min.js"}}</script>
</head>
<body class="atTitle">
<canvas id="gl"></canvas>
<div id="touchzone"></div>
<div id="numbers"></div>
<div id="vignette"></div>
<div id="hurtFlash"></div>

<!-- ============ HUD ============ -->
<div id="hud" hidden>
  <div id="hudTL">
    <div class="vit">
      <div class="lvl" title="Level">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" class="track"/><circle id="lvlArc" cx="20" cy="20" r="18" class="arc"/></svg>
        <b id="lvlN">1</b>
      </div>
      <div class="bars">
        <div class="bar hp"><i class="trail" id="hpTrail"></i><i class="fill" id="hpF"></i><span id="hpT"></span></div>
        <div class="bar vg" title="Vigor"><i class="fill" id="vgF"></i></div>
        <div class="pools">
          <div class="pool" id="mpw_air" title="Air"><i data-icon="air"></i><div class="g"><i id="mp_air"></i></div><span id="mpn_air"></span></div>
          <div class="pool" id="mpw_fire" title="Fire"><i data-icon="fire"></i><div class="g"><i id="mp_fire"></i></div><span id="mpn_fire"></span></div>
          <div class="pool" id="mpw_earth" title="Earth"><i data-icon="earth"></i><div class="g"><i id="mp_earth"></i></div><span id="mpn_earth"></span></div>
          <div class="pool" id="mpw_water" title="Water"><i data-icon="water"></i><div class="g"><i id="mp_water"></i></div><span id="mpn_water"></span></div>
          <button class="info" data-info="mana" aria-label="About mana"><i data-icon="info"></i></button>
        </div>
        <div class="under"><span id="potions" class="potions"></span><span id="rankN" class="rank"></span></div>
      </div>
    </div>
  </div>
  <div id="hudTop">
    <div id="compass" hidden><span id="compassArrow"><i data-icon="up"></i></span><span class="ct"><b id="compassName"></b><small id="compassDist"></small></span></div>
    <div id="place"><span id="dayIco"></span><span id="placeName"></span></div>
  </div>
  <div id="bossBar" hidden><div id="bossName"></div><div class="bbar"><i id="bossF"></i></div></div>
  <div id="hudTR">
    <canvas id="minimap" aria-label="Minimap"></canvas>
    <div class="hbtns">
      <button id="btnMap" class="iconBtn" aria-label="Map"><i data-icon="map"></i></button>
      <button id="btnBook" class="iconBtn" aria-label="Spellbook"><i data-icon="book"></i></button>
      <button id="btnPause" class="iconBtn" aria-label="Pause"><i data-icon="pause"></i></button>
    </div>
  </div>
  <div id="spellbar"></div>
  <div id="coach" hidden></div>
  <div id="triggerHint" hidden></div>
  <div id="edgeArrow"><i data-icon="up"></i></div>
  <div id="toasts"></div>
  <div id="banner" class="banner"></div>
</div>

<!-- ============ touch ============ -->
<div id="touchUI" hidden>
  <div class="stick" id="stickL"><div class="nub"></div></div>
  <div class="stick" id="stickR"><div class="nub"></div></div>
  <button id="tDash" class="tb big" aria-label="Dash"><i data-icon="dash"></i><span>Dash</span></button>
  <button id="tPotion" class="tb" aria-label="Drink a potion"><i data-icon="flask"></i><b id="tPotionN">2</b></button>
  <button id="tTrigger" class="tb hot" aria-label="Release the payload" hidden><i data-icon="trigger"></i></button>
</div>

<!-- ============ Spellbook ============ -->
<section id="book" hidden aria-label="Spellbook">
  <header class="bookHead">
    <div id="bookSlots"></div>
    <div class="spacer"></div>
    <button class="info" data-info="spells" aria-label="How drawing works"><i data-icon="info"></i></button>
    <button id="bookPresets" class="btn ghost" aria-label="Examples"><i data-icon="sparkle"></i><span>Examples</span></button>
    <button id="bookClose" class="btn primary">Done</button>
  </header>
  <div class="bookBody">
    <div class="pageWrap">
      <canvas id="page"></canvas>
      <div id="pageHint"></div>
      <div id="stamps" aria-label="Stamps">
        <button data-el="air" title="Air: triangle" style="--c:#a0e0e0"><i data-icon="air"></i></button>
        <button data-el="fire" title="Fire: square" style="--c:#ff6633"><i data-icon="fire"></i></button>
        <button data-el="earth" title="Earth: pentagon" style="--c:#80c060"><i data-icon="earth"></i></button>
        <button data-el="water" title="Water: hexagon" style="--c:#4488ff"><i data-icon="water"></i></button>
      </div>
      <div id="bookTools">
        <button data-tool="glyph" title="Glyph (G)"><i data-icon="toolGlyph"></i><span>Glyph</span></button>
        <button data-tool="seal" title="Seal (S)"><i data-icon="toolSeal"></i><span>Seal</span></button>
        <button data-tool="rune" title="Rune (R)"><i data-icon="toolRune"></i><span>Rune</span></button>
        <button data-tool="erase" title="Erase (X)"><i data-icon="toolErase"></i><span>Erase</span></button>
        <span class="sep"></span>
        <button id="toolMirror" title="Mirror left and right"><i data-icon="layers"></i><span>Mirror</span></button>
        <button id="toolUndo" title="Undo (Ctrl+Z)"><i data-icon="undo"></i><span>Undo</span></button>
        <button id="toolClear" title="Clear this layer"><i data-icon="trash"></i><span>Clear</span></button>
        <button id="toolView" title="Reset the view"><i data-icon="target"></i><span>View</span></button>
      </div>
    </div>
    <aside class="bookSide">
      <input id="spellName" maxlength="22" autocomplete="off" spellcheck="false" aria-label="Spell name">
      <div id="readout"></div>
      <div id="bookWarn" hidden></div>
      <canvas id="preview" aria-label="Preview"></canvas>
      <div class="field">
        <label>Layers <button class="info" data-info="spells" aria-label="About layers"><i data-icon="info"></i></button></label>
        <div id="layerTabs"></div>
        <small id="layerNote"></small>
      </div>
      <div class="field">
        <label>Power <b id="powerN">1</b> <button class="info" data-info="spectrum" aria-label="About power"><i data-icon="info"></i></button></label>
        <input type="range" id="power" min="1" max="10" step="1" value="1">
      </div>
      <div id="rankLine"></div>
    </aside>
  </div>
</section>
<div id="presets" class="sheetish" hidden>
  <header><h2>Examples</h2><button id="presetsClose" class="iconBtn" aria-label="Close"><i data-icon="close"></i></button></header>
  <p class="muted">Loading one replaces this scroll. Undo brings yours back.</p>
  <div id="presetList"></div>
</div>

<!-- ============ Map ============ -->
<section id="map" hidden aria-label="Map">
  <canvas id="mapCanvas"></canvas>
  <div class="mapHead">
    <span id="mapSeed"></span>
    <button class="info" data-info="map" aria-label="About the map"><i data-icon="info"></i></button>
    <div class="spacer"></div>
    <button id="mapHome" class="iconBtn" aria-label="Back to where you are"><i data-icon="target"></i></button>
    <button id="mapClose" class="btn primary">Done</button>
  </div>
  <div class="mapHint">Tap a lit waystone to step there</div>
</section>

<!-- ============ screens ============ -->
<section id="scr-title" class="screen title" hidden>
  <div class="tcard">
    <svg class="crest" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="29" opacity=".5"/><circle cx="32" cy="32" r="22"/>
      <path d="M32 12l17.3 30H14.7z"/><circle cx="32" cy="32" r="4" fill="currentColor"/>
    </svg>
    <h1>Magic Circles</h1>
    <p class="tag">A Certain RPG</p>
    <div class="tbtns">
      <button id="btnContinue" class="btn primary wide" hidden><span>Continue</span><small></small></button>
      <button id="btnNew" class="btn wide">New journey</button>
      <button id="btnBookTitle" class="btn wide"><i data-icon="book"></i>Spellbook</button>
      <div class="trow">
        <button id="btnSettingsTitle" class="btn ghost"><i data-icon="gear"></i>Settings</button>
        <button class="btn ghost" data-info="howto"><i data-icon="info"></i>How to play</button>
      </div>
    </div>
    <p id="titleBest" class="muted"></p>
  </div>
  <footer><span id="verLine"></span> · <button class="link" data-info="controls">Controls</button> · <button class="link" data-info="privacy">What is stored</button> · <button class="link" data-info="credits">Credits</button> · <a class="link" href="https://buymeacoffee.com/noju" target="_blank" rel="noopener">Buy me a coffee</a></footer>
</section>

<section id="scr-new" class="screen" hidden>
  <div class="panel">
    <h2>A new journey</h2>
    <div class="field">
      <label for="seedIn">Seed <button class="info" data-info="seed" aria-label="About seeds"><i data-icon="info"></i></button></label>
      <input id="seedIn" class="txt mono" maxlength="32" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label>Who walks it</label>
      <div id="looks"></div>
    </div>
    <div class="stackbtns">
      <button id="btnNewGo" class="btn primary wide"><i data-icon="play"></i>Begin</button>
      <button id="btnNewBack" class="btn ghost wide">Back</button>
    </div>
  </div>
</section>

<section id="scr-pause" class="screen" hidden>
  <div class="panel">
    <h2>Paused</h2>
    <p id="pauseStats" class="muted"></p>
    <p id="pauseSeed" class="muted mono"></p>
    <div class="stackbtns">
      <button id="btnResume" class="btn primary wide"><i data-icon="play"></i>Resume</button>
      <div class="trow">
        <button id="btnPauseBook" class="btn"><i data-icon="book"></i>Spellbook</button>
        <button id="btnPauseMap" class="btn"><i data-icon="map"></i>Map</button>
      </div>
      <div class="trow">
        <button id="btnPauseSettings" class="btn ghost"><i data-icon="gear"></i>Settings</button>
        <button class="btn ghost" data-info="controls"><i data-icon="pad"></i>Controls</button>
        <button class="btn ghost" data-info="wardens"><i data-icon="crown"></i>Wardens</button>
      </div>
      <button id="btnQuit" class="btn ghost wide"><i data-icon="exit"></i>Save and leave to the title</button>
    </div>
  </div>
</section>

<section id="scr-settings" class="screen" hidden>
  <div class="panel">
    <h2>Settings</h2>
    <div class="setrow">
      <label for="setQuality">Graphics <button class="info" data-info="quality" aria-label="About graphics"><i data-icon="info"></i></button></label>
      <span><select id="setQuality"><option value="auto">Auto</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select> <small id="qualityNow" class="muted"></small></span>
    </div>
    <div class="setrow"><label for="set_master">Volume</label><input type="range" id="set_master" min="0" max="100"></div>
    <div class="setrow"><label for="set_music">Music</label><input type="range" id="set_music" min="0" max="100"></div>
    <div class="setrow"><label for="set_sfx">Effects</label><input type="range" id="set_sfx" min="0" max="100"></div>
    <label class="tog"><input type="checkbox" id="set_shake"><span>Screen shake</span></label>
    <label class="tog"><input type="checkbox" id="set_numbers"><span>Damage numbers</span></label>
    <label class="tog"><input type="checkbox" id="set_flashes"><span>Bright flashes</span></label>
    <label class="tog"><input type="checkbox" id="set_autoAim"><span>Touch: holding still aims for you</span></label>
    <div class="verbox">
      <span id="setVersion"></span>
      <button id="btnCheckUpdate" class="btn ghost small"><i data-icon="refresh"></i>Check for updates</button>
      <button class="info" data-info="update" aria-label="About updates"><i data-icon="info"></i></button>
      <small id="updateStatus" class="muted"></small>
    </div>
    <div class="stackbtns">
      <button id="btnSettingsBack" class="btn primary wide">Back</button>
      <button id="btnResetAll" class="btn danger small">Erase all saved data</button>
    </div>
  </div>
</section>

<section id="scr-death" class="screen" hidden>
  <div class="panel">
    <h2 class="red">You fall</h2>
    <p id="deathBy" class="muted"></p>
    <div class="stackbtns">
      <button id="btnWake" class="btn primary wide"><i data-icon="waystone"></i>Wake at your waystone</button>
      <button id="btnDeathTitle" class="btn ghost wide">To the title</button>
    </div>
  </div>
</section>

<!-- ============ info sheet, update bar, curtain ============ -->
<div id="info-scrim" hidden></div>
<div id="info-sheet" role="dialog" aria-labelledby="info-title" hidden>
  <header><h2 id="info-title"></h2><button id="info-close" class="iconBtn" aria-label="Close"><i data-icon="close"></i></button></header>
  <div id="info-body"></div>
</div>
<div id="update-bar" hidden><span>A new version is ready.</span><button id="update-go" class="btn primary small">Reload</button><button id="update-later" class="btn ghost small">Later</button></div>
<div id="fade"></div>
<div id="loading">
  <svg class="crest spin" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="22"/><path d="M32 12l17.3 30H14.7z"/><path d="M32 52L14.7 22h34.6z" opacity=".55"/>
  </svg>
  <b>Drawing the circle</b>
  <div class="lbar"><i id="loadBar"></i></div>
  <noscript>Magic Circles needs JavaScript.</noscript>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
